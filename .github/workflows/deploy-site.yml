name: Deploy Naghsh Negar website

on:
  push:
    branches:
      - main
    paths:
      - 'naqsh-negar-source.zip'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website source
        run: |
          mkdir -p "$RUNNER_TEMP/naqsh-negar"
          unzip -q naqsh-negar-source.zip -d "$RUNNER_TEMP/naqsh-negar"
          test -f "$RUNNER_TEMP/naqsh-negar/naqsh-negar/package.json"
          test -f "$RUNNER_TEMP/naqsh-negar/naqsh-negar/vite.config.ts"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Vite for the GitHub Pages path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "naqsh-negar" / "naqsh-negar" / "vite.config.ts"
          s = p.read_text()
          if "base:" not in s:
              s = s.replace("export default defineConfig({", "export default defineConfig({\n  base: '/nagshe-negar/',", 1)
          s = s.replace("start_url: '/',", "start_url: '/nagshe-negar/',")
          s = s.replace("scope: '/',", "scope: '/nagshe-negar/',")
          s = s.replace("src: '/patchwork.svg'", "src: '/nagshe-negar/patchwork.svg'")
          s = s.replace("navigateFallback: '/index.html'", "navigateFallback: '/nagshe-negar/index.html'")
          p.write_text(s)
          PY

      - name: Install dependencies and build website
        working-directory: ${{ runner.temp }}/naqsh-negar/naqsh-negar
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/naqsh-negar/naqsh-negar/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
