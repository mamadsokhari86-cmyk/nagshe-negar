name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'naqsh-negar-source.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          if [ ! -f naqsh-negar-source.zip ]; then
            echo "::error::Upload naqsh-negar-source.zip to the repository root first."
            exit 1
          fi

      - name: Extract project source
        run: |
          mkdir -p "$RUNNER_TEMP/naqsh-negar"
          unzip -q naqsh-negar-source.zip -d "$RUNNER_TEMP/naqsh-negar"
          test -f "$RUNNER_TEMP/naqsh-negar/naqsh-negar/package.json"
          echo "PROJECT_DIR=$RUNNER_TEMP/naqsh-negar/naqsh-negar" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies and build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naqsh-negar-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
